name: CI

# Hardware-agnostic by design.
#
# The core promise of this project is that providers are *claims* and probes are
# *checks*. A machine with no GPU, no CUDA and no downloaded model is therefore
# a perfectly valid place to run the whole test suite — every heavy provider
# must degrade to an honest `UNAVAILABLE` rather than failing the build.
#
# What this workflow deliberately does NOT do:
#   - download models (multi-GB, and it would make CI a licensing grey zone)
#   - install torch / CUDA (the core must never depend on them)
#   - call any paid API (no keys exist here, and a CI secret is not a test)
#
# What it proves instead: the contracts hold, the routing selects something
# real, the IR round-trips, and a video can actually be assembled end to end
# from mock audio. Real hardware validation is tracked separately in
# docs/CURRENT_STATUS.md as `REAL HARDWARE VALIDATION PENDING`.
#
# PHASE 3 addition: GitHub is the authority for the full suite. The local
# Windows box cannot run `pytest` to completion (see "LOCAL ENVIRONMENT
# LIMITATION" in the Phase 3 report), so a green run here — not a green run
# there — is what counts. No `|| true`, no `continue-on-error`, no skipping a
# failing test to manufacture a green tick.

# `statuses: write` is what lets a failing job publish *which* test broke as a
# commit status — the only CI output readable without a browser session or a
# personal token.
permissions:
  contents: read
  statuses: write

on:
  push:
    branches: ["main", "phase3-productization"]
  pull_request:
    branches: ["main", "phase3-productization"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  # Keep every generated artifact inside the workspace. The project rule is
  # "heavy files never land in the default home directory".
  HVW_HOME: ${{ github.workspace }}/.hvw-home

jobs:
  # The runner's console output is not readable from outside a browser session,
  # so granularity has to be bought with structure: one job per test file means
  # a red build points at the file that broke.
  discover:
    name: Discover test files
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.list.outputs.files }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          echo "files=$(python -c 'import glob, json; print(json.dumps(sorted(glob.glob("tests/test_*.py"))))')" >> "$GITHUB_OUTPUT"

      # Canary: proves commit-status reporting works *before* a build needs it.
      # If this ever disappears, the failure reports are silently lost.
      - name: Verify status reporting works
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/ci_status.py "ci/status-reporting" success "reporting online"

  pytest:
    name: ${{ matrix.file }}
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.discover.outputs.files) }}
    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,api]"

      - name: Verify ffmpeg
        run: ffmpeg -version | head -n 1

      - name: Run ${{ matrix.file }}
        run: python -m pytest "${{ matrix.file }}" --junitxml=junit.xml

      # A runner's console log is only readable from a browser session, and the
      # junit artifact needs auth. A commit status does not: it is visible to
      # anyone with read access to the repo, including a CI-less client. This is
      # how a red build says *which* test broke without leaking anything.
      - name: Report failures as a commit status
        if: failure()
        env:
          # Actions does not inject secrets into the step environment on its
          # own; without this the posting helper silently does nothing.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FILE: ${{ matrix.file }}
        run: |
          python - <<'PY'
          import os, pathlib, subprocess
          import xml.etree.ElementTree as ET

          names = []
          path = pathlib.Path("junit.xml")
          if path.exists():
              suite = ET.parse(path).getroot()
              suite = suite if suite.tag == "testsuite" else suite[0]
              for case in suite.iter("testcase"):
                  for child in list(case):
                      if child.tag in ("failure", "error"):
                          names.append(case.get("name", "?").split("::")[-1])
          if not names:
              names = ["failed with no junit record"]
          context = "pytest/" + os.environ["FILE"].split("/")[-1]
          subprocess.run(["python", "scripts/ci_status.py", context, "failure",
                          ", ".join(names)], check=True)
          PY

      - name: Upload the test record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ strategy.job-index }}
          path: junit.xml
          if-no-files-found: warn
          retention-days: 7

  python:
    name: Python tests + schema
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,api]"

      # ffmpeg is a hard dependency of the audio post-processing and the
      # composition stage. Ubuntu's runner image ships it, but the version is
      # pinned only loosely because the filters used (loudnorm, silenceremove,
      # afade, zoompan) have been stable for years.
      - name: Verify ffmpeg
        run: ffmpeg -version | head -n 1

      - name: Confirm the console entry point is installed
        run: html-video --help

      # Separate step so a red build says *which* phase broke: a collection
      # error (bad import on this platform) and a real assertion failure look
      # identical if they land in the same step.
      - name: Collect tests
        run: python -m pytest tests --collect-only -q

      # The suite summary is the deliverable. `-q` alone has been seen to print
      # no summary line under a constrained runner, so the junit report is the
      # record and the job fails on any failure/error it contains.
      - name: Run tests
        run: python -m pytest tests --junitxml=junit.xml

      - name: Summarise the test record
        if: always()
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("junit.xml").getroot()
          suite = root if root.tag == "testsuite" else root[0]
          counts = {k: int(suite.get(k) or 0)
                    for k in ("tests", "failures", "errors", "skipped")}
          print(" ".join(f"{k}={v}" for k, v in counts.items()))
          for case in suite.iter("testcase"):
              for child in list(case):
                  if child.tag in ("failure", "error"):
                      print(f"  {child.tag.upper()} {case.get('name')}: "
                            f"{(child.get('message') or '')[:200]}")
          if counts["failures"] or counts["errors"]:
              raise SystemExit("test suite is not green")
          if counts["tests"] == 0:
              raise SystemExit("no tests ran — the suite did not execute")
          PY

      - name: Verify IR V2 schemas match the models
        run: python scripts/export_schema.py --check

      - name: Provider registry loads with zero silent failures
        # A provider module that fails to import used to be swallowed by a bare
        # `except Exception`. That hid eight of nine providers. This step fails
        # the build if anything disappears again.
        run: |
          python - <<'PY'
          from html_video_workflow.providers.registry import load_failures, by_type

          failures = load_failures()
          if failures:
              for name, why in failures.items():
                  print(f"FAILED TO LOAD {name}: {why}")
              raise SystemExit(f"{len(failures)} provider module(s) failed to import")

          for kind in ("tts", "renderer", "llm", "subtitle"):
              ids = [p.id for p in by_type(kind)]
              print(f"{kind}: {ids}")
              if not ids:
                  raise SystemExit(f"no providers registered for {kind}")
          PY

      - name: Upload the test record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: junit.xml
          if-no-files-found: warn
          retention-days: 7

  studio:
    name: Studio typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: apps/studio

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # The built frontend is an artifact, not a developer-only side effect:
      # `html-video studio` must be able to serve it without the user ever
      # running npm themselves.
      - name: Upload the built frontend
        uses: actions/upload-artifact@v4
        with:
          name: studio-build
          path: apps/studio/dist
          if-no-files-found: error
          retention-days: 7

  package:
    name: Build and install the wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json

      # The Studio is built here and vendored into the package, so the wheel
      # carries a working GUI. This is the step that makes "Node is not a
      # runtime dependency for an end user" true rather than aspirational.
      - name: Build the Studio frontend
        working-directory: apps/studio
        run: |
          npm ci
          npm run build

      - name: Vendor the built frontend into the package
        run: |
          rm -rf src/html_video_workflow/studio_dist
          mkdir -p src/html_video_workflow/studio_dist
          cp -r apps/studio/dist/. src/html_video_workflow/studio_dist/

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install the wheel into a clean virtualenv
        # A wheel that only works when the source tree is importable is not a
        # package. This is the check that catches missing package-data (the
        # builtin template manifests are JSON, and so is the Studio frontend).
        run: |
          python -m venv .ci-venv
          .ci-venv/bin/python -m pip install --upgrade pip
          # Quoted glob: the extras suffix would otherwise be read as a shell
          # character class and silently match the wrong file.
          wheel="$(ls dist/*.whl)"
          .ci-venv/bin/python -m pip install "${wheel}[api]"
          .ci-venv/bin/html-video --help
          .ci-venv/bin/html-video studio --help
          .ci-venv/bin/python - <<'PY'
          from html_video_workflow.api.studio import studio_dist
          from html_video_workflow.templates.registry import get_registry

          registry = get_registry()
          templates = registry.templates()
          styles = registry.styles()
          print("templates:", [t.id for t in templates])
          print("styles:", [s.id for s in styles])
          if not templates or not styles:
              raise SystemExit("wheel shipped without the builtin manifests")

          dist = studio_dist()
          print("studio frontend:", dist)
          if dist is None:
              raise SystemExit(
                  "the wheel shipped without the Studio frontend, so an end "
                  "user would need Node to see the GUI")
          PY

      - name: Upload the distribution
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/
          if-no-files-found: error
          retention-days: 7

  one-click:
    # Runs on Windows on purpose. The renderer drives Edge and the local voice
    # path is SAPI, so this is the platform the product actually targets — a
    # Linux runner would be testing a browser stack nobody ships.
    name: One-click E2E (CLI, SDK, REST, MCP)
    runs-on: windows-latest
    needs: python
    timeout-minutes: 25

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,api]"

      # windows-latest does not ship ffmpeg on PATH. Composition cannot run
      # without it, so it is installed here rather than worked around.
      - name: Install ffmpeg
        shell: pwsh
        run: |
          choco install ffmpeg --no-progress -y
          $exe = (Get-Command ffmpeg.exe -ErrorAction Stop).Source
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path -Parent $exe)
          & $exe -version | Select-Object -First 1

      - name: Verify ffmpeg
        run: ffmpeg -version | head -n 1

      - name: Doctor must not claim anything it has not probed
        # `doctor` uses `??` for installed-but-unusable and `--` for absent.
        # A regression to a binary pass/fail would show up here as `OK` for a
        # provider that cannot possibly be OK on a GPU-less runner.
        run: html-video doctor

      # 320x180 and one scene. The point is to prove the whole pipeline runs —
      # source, plan, IR, render, voice, compose, QC — not to benchmark it; a
      # 1080p 30-second render would only make CI slow and flaky.
      #
      # The diagnosis lives in scripts/e2e_one_click.py, which posts every
      # observation as a commit status. `continue-on-error` is *not* a way to
      # tolerate failure: the gate step below turns the job red. It exists so
      # that a step which dies before it can report still reaches its own
      # reporting pass. Leaving it out once cost a build cycle to a red job
      # that said nothing except "exit code 1".
      - name: CLI one-click produces a real MP4
        id: cli_e2e
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/e2e_one_click.py

      - name: Report that the CLI E2E step died before it could report
        # Only fires when the step above produced no diagnosis at all, which is
        # the exact case that used to be silent.
        if: steps.cli_e2e.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import pathlib, subprocess

          worst = ""
          for name in ("cli-stderr-cli.txt", "cli-result-cli.json",
                       "cli-stderr-cli-mock-tts.txt"):
              path = pathlib.Path(name)
              if path.exists():
                  text = path.read_text(encoding="utf-8", errors="replace").strip()
                  if text:
                      worst = f"{name}: {text[-110:]}"
                      break
          if not worst:
              worst = "the CLI E2E step died before producing any output"
          subprocess.run(["python", "scripts/ci_status.py", "e2e/cli/died",
                          "failure", worst[:130]], check=False)
          PY

      # The remaining three entry points report their own statuses too, so one
      # push tells us everything about the public surface rather than stopping
      # at the first broken one.
      - name: SDK, REST and MCP one-click
        id: entry_points
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/e2e_entry_points.py

      - name: Fail the job if any one-click entry point failed
        # This is the only thing standing between `continue-on-error` above and
        # a green tick that means nothing.
        if: steps.cli_e2e.outcome == 'failure' || steps.entry_points.outcome == 'failure'
        run: |
          echo "A one-click entry point failed. The reason is in the e2e/*"
          echo "commit statuses on this commit, and in the uploaded artifacts."
          exit 1

      - name: Upload the E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-click-smoke
          path: |
            e2e-out/**/*.mp4
            e2e-out-sdk/**/*.mp4
            e2e-out-api/**/*.mp4
            e2e-out-mcp/**/*.mp4
            cli-result-*.json
            cli-stderr-*.txt
          if-no-files-found: warn
          retention-days: 7
