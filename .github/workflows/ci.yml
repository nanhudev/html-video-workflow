name: CI

# Hardware-agnostic by design.
#
# The core promise of this project is that providers are *claims* and probes are
# *checks*. A machine with no GPU, no CUDA and no downloaded model is therefore
# a perfectly valid place to run the whole test suite — every heavy provider
# must degrade to an honest `UNAVAILABLE` rather than failing the build.
#
# What this workflow deliberately does NOT do:
#   - download models (multi-GB, and it would make CI a licensing grey zone)
#   - install torch / CUDA (the core must never depend on them)
#   - call any paid API (no keys exist here, and a CI secret is not a test)
#
# What it proves instead: the contracts hold, the routing selects something
# real, the IR round-trips, and a video can actually be assembled end to end
# from mock audio. Real hardware validation is tracked separately in
# docs/CURRENT_STATUS.md as `REAL HARDWARE VALIDATION PENDING`.
#
# PHASE 3 addition: GitHub is the authority for the full suite. The local
# Windows box cannot run `pytest` to completion (see "LOCAL ENVIRONMENT
# LIMITATION" in the Phase 3 report), so a green run here — not a green run
# there — is what counts. No `|| true`, no `continue-on-error`, no skipping a
# failing test to manufacture a green tick.

on:
  push:
    branches: ["main", "phase3-productization"]
  pull_request:
    branches: ["main", "phase3-productization"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  # Keep every generated artifact inside the workspace. The project rule is
  # "heavy files never land in the default home directory".
  HVW_HOME: ${{ github.workspace }}/.hvw-home

jobs:
  python:
    name: Python tests + schema
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,api]"

      # ffmpeg is a hard dependency of the audio post-processing and the
      # composition stage. Ubuntu's runner image ships it, but the version is
      # pinned only loosely because the filters used (loudnorm, silenceremove,
      # afade, zoompan) have been stable for years.
      - name: Verify ffmpeg
        run: ffmpeg -version | head -n 1

      - name: Confirm the console entry point is installed
        run: html-video --help

      # The suite summary is the deliverable. `-q` alone has been seen to print
      # no summary line under a constrained runner, so the junit report is the
      # record and the job fails on any failure/error it contains.
      - name: Run tests
        run: python -m pytest tests --junitxml=junit.xml

      - name: Summarise the test record
        if: always()
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("junit.xml").getroot()
          suite = root if root.tag == "testsuite" else root[0]
          counts = {k: int(suite.get(k) or 0)
                    for k in ("tests", "failures", "errors", "skipped")}
          print(" ".join(f"{k}={v}" for k, v in counts.items()))
          for case in suite.iter("testcase"):
              for child in list(case):
                  if child.tag in ("failure", "error"):
                      print(f"  {child.tag.upper()} {case.get('name')}: "
                            f"{(child.get('message') or '')[:200]}")
          if counts["failures"] or counts["errors"]:
              raise SystemExit("test suite is not green")
          if counts["tests"] == 0:
              raise SystemExit("no tests ran — the suite did not execute")
          PY

      - name: Verify IR V2 schemas match the models
        run: python scripts/export_schema.py --check

      - name: Provider registry loads with zero silent failures
        # A provider module that fails to import used to be swallowed by a bare
        # `except Exception`. That hid eight of nine providers. This step fails
        # the build if anything disappears again.
        run: |
          python - <<'PY'
          from html_video_workflow.providers.registry import load_failures, by_type

          failures = load_failures()
          if failures:
              for name, why in failures.items():
                  print(f"FAILED TO LOAD {name}: {why}")
              raise SystemExit(f"{len(failures)} provider module(s) failed to import")

          for kind in ("tts", "renderer", "llm", "subtitle"):
              ids = [p.id for p in by_type(kind)]
              print(f"{kind}: {ids}")
              if not ids:
                  raise SystemExit(f"no providers registered for {kind}")
          PY

      - name: Upload the test record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: junit.xml
          if-no-files-found: warn
          retention-days: 7

  studio:
    name: Studio typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: apps/studio

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # The built frontend is an artifact, not a developer-only side effect:
      # `html-video studio` must be able to serve it without the user ever
      # running npm themselves.
      - name: Upload the built frontend
        uses: actions/upload-artifact@v4
        with:
          name: studio-build
          path: apps/studio/dist
          if-no-files-found: error
          retention-days: 7

  package:
    name: Build and install the wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install the wheel into a clean virtualenv
        # A wheel that only works when the source tree is importable is not a
        # package. This is the check that catches missing package-data (the
        # builtin template manifests are JSON, not Python).
        run: |
          python -m venv .ci-venv
          .ci-venv/bin/python -m pip install --upgrade pip
          .ci-venv/bin/python -m pip install dist/*.whl
          .ci-venv/bin/html-video --help
          .ci-venv/bin/python - <<'PY'
          from html_video_workflow.templates.registry import get_registry
          registry = get_registry()
          templates = registry.templates()
          styles = registry.styles()
          print("templates:", [t.id for t in templates])
          print("styles:", [s.id for s in styles])
          if not templates or not styles:
              raise SystemExit("wheel shipped without the builtin manifests")
          PY

      - name: Upload the distribution
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/
          if-no-files-found: error
          retention-days: 7

  one-click:
    name: One-click E2E (CLI, SDK, REST, MCP)
    runs-on: ubuntu-latest
    needs: python
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,api]"

      - name: Verify ffmpeg
        run: ffmpeg -version | head -n 1

      - name: Doctor must not claim anything it has not probed
        # `doctor` uses `??` for installed-but-unusable and `--` for absent.
        # A regression to a binary pass/fail would show up here as `OK` for a
        # provider that cannot possibly be OK on a GPU-less runner.
        run: html-video doctor

      # 320x180 and one scene. The point is to prove the whole pipeline runs —
      # source, plan, IR, render, voice, compose, QC — not to benchmark it; a
      # 1080p 30-second render would only make CI slow and flaky.
      - name: CLI one-click produces a real MP4
        run: |
          set -euo pipefail
          html-video generate "Why local AI matters" \
            --width 320 --height 180 --duration 6 --scenes 1 \
            --out ci-out --json | tee cli-result.json
          python - <<'PY'
          import json, pathlib, subprocess, sys
          result = json.loads(pathlib.Path("cli-result.json").read_text())
          if not result.get("ok"):
              raise SystemExit(f"CLI reported failure: {result.get('error')}")
          video = result.get("video_path")
          if not video or not pathlib.Path(video).exists():
              raise SystemExit(f"no MP4 at {video!r}")
          print("MP4:", video, pathlib.Path(video).stat().st_size, "bytes")
          out = subprocess.run(
              ["ffprobe", "-v", "error", "-select_streams", "v:0",
               "-show_entries", "stream=width,height",
               "-show_entries", "format=duration",
               "-of", "default=noprint_wrappers=1", video],
              capture_output=True, text=True, check=True)
          print(out.stdout.strip())
          duration = float(subprocess.run(
              ["ffprobe", "-v", "error", "-show_entries", "format=duration",
               "-of", "default=noprint_wrappers=1:nokey=1", video],
              capture_output=True, text=True, check=True).stdout.strip())
          if not 0.5 <= duration <= 60:
              raise SystemExit(f"implausible duration: {duration}s")
          print(f"ffprobe OK: {duration:.2f}s")
          PY

      - name: Python SDK one-click produces a real MP4
        run: |
          python - <<'PY'
          import pathlib
          from html_video_workflow import create_video

          result = create_video("Why local AI matters", width=320, height=180,
                                duration_sec=6, scenes=1, out_dir="ci-out-py")
          print(result.to_dict())
          if not result.ok:
              raise SystemExit(f"SDK reported failure: {result.error}")
          if not result.video_path or not pathlib.Path(result.video_path).exists():
              raise SystemExit(f"no MP4 at {result.video_path!r}")
          print("SDK MP4:", result.video_path)
          PY

      - name: REST /v1/videos honours wait=true and wait=false
        run: |
          python - <<'PY'
          import pathlib
          from fastapi.testclient import TestClient
          from html_video_workflow.api.app import create_app

          client = TestClient(create_app())
          body = {"prompt": "Why local AI matters", "width": 320, "height": 180,
                  "duration_sec": 6, "scenes": 1, "out_dir": "ci-out-api"}

          sync = client.post("/v1/videos", json=body, params={"wait": "true"})
          print("wait=true ->", sync.status_code)
          if sync.status_code != 200 or not sync.json().get("ok"):
              raise SystemExit(f"synchronous create failed: {sync.text[:400]}")
          video = sync.json().get("video_path")
          if not video or not pathlib.Path(video).exists():
              raise SystemExit(f"synchronous create produced no MP4: {video!r}")

          async_ = client.post("/v1/videos", json=body, params={"wait": "false"})
          print("wait=false ->", async_.status_code)
          if async_.status_code != 200:
              raise SystemExit(f"asynchronous create failed: {async_.text[:400]}")
          if not async_.json().get("job_id"):
              raise SystemExit("asynchronous create returned no job id")
          PY

      - name: MCP exposes create_video and calls the same Runtime
        run: |
          python - <<'PY'
          import json
          from html_video_workflow.mcp import handle_message

          def call(method, **params):
              return handle_message({"jsonrpc": "2.0", "id": 1,
                                     "method": method, "params": params})

          tools = call("tools/list")["result"]["tools"]
          names = {tool["name"] for tool in tools}
          print("tools:", sorted(names))
          for required in ("create_video", "suggest_topics", "list_templates",
                           "list_styles", "get_job"):
              if required not in names:
                  raise SystemExit(f"MCP is missing {required}")

          result = call("tools/call", name="list_templates")
          payload = json.loads(result["result"]["content"][0]["text"])
          if not payload:
              raise SystemExit("list_templates returned nothing")
          print("MCP list_templates:", len(payload), "templates")
          PY

      - name: Upload the E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-click-smoke
          path: |
            ci-out/**/*.mp4
            ci-out-py/**/*.mp4
            ci-out-api/**/*.mp4
            cli-result.json
          if-no-files-found: warn
          retention-days: 7
