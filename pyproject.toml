[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "html-video-workflow"
version = "0.4.0"
description = "Local-first agentic video production runtime — one prompt in, one MP4 out"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["video", "ffmpeg", "agent", "mcp", "tts", "html"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Video",
    "Environment :: Console",
]
dependencies = [
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.5",
]

[project.scripts]
html-video = "html_video_workflow.cli:main"
html-video-mcp = "html_video_workflow.mcp.server:serve_stdio"

[project.urls]
Homepage = "https://github.com/nanhudev/html-video-workflow"
Documentation = "https://github.com/nanhudev/html-video-workflow/blob/main/docs/API.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# `studio_dist` is not a Python package — it is the built Studio frontend,
# copied in by the release build so an installed wheel can serve the GUI
# without Node ever being installed. Absent when building from a bare checkout,
# which is why `html-video studio` reports that instead of serving a blank page.
html_video_workflow = [
    "py.typed",
    "templates/builtins/*.json",
    "studio_dist/*",
    "studio_dist/assets/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
